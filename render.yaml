# ============================================================
#   SOPORTE MOVISTAR — Render Blueprint (api/)
#   Despliega la API centralizada del clan en Render.com
#   Uso: conectar el repo en Render → "Blueprint" (render.yaml)
#   o crear Web Service manualmente con estos mismos valores.
# ============================================================

services:
  # API con base de datos centralizada (inscripciones, eventos, fotos)
  - type: web
    name: soporte-movistar-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # Permitir llamadas desde el sitio (GitHub Pages). Puedes
      # restringirlo a tu dominio si quieres más seguridad, ej:
      #   CORS_ORIGIN: https://tu-usuario.github.io
      - key: CORS_ORIGIN
        value: "*"
      # ⚠️ OBLIGATORIO: la connection string de tu base PostgreSQL
      # (Supabase). Pégala aquí o como variable de entorno del servicio
      # en el panel de Render. Ej:
      #   postgresql://postgres.xxxx:TU-PASSWORD@aws-0-xxxx.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        value: ""