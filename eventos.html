<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte Movistar | Eventos</title>
  <meta name="description" content="Consulta los próximos eventos, torneos, capturas y concursos del clan Soporte Movistar de PokeMMO.">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="icon" href="./assets/logo/logo.png" type="image/png">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('sm-tema') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  </script>
</head>
<body data-pagina="eventos">

  <main>
    <section class="pagina-cabecera">
      <span class="pagina-ico" aria-hidden="true">📅</span>
      <h1>EVENTOS</h1>
      <p>Explorá todos los eventos del clan. Filtrá por estado o tipo, o buscá directamente el que te interesa.</p>
    </section>

    <section class="seccion" aria-label="Eventos del clan">
      <div class="contenedor">
        <!-- Contadores por estado -->
        <div id="mapa-estados" class="mapa-estados"></div>

        <!-- Herramientas de filtrado -->
        <div class="barra-herramientas" role="toolbar" aria-label="Filtros de eventos">
          <div class="herramientas-staff" id="herramientas-staff" hidden></div>
          <div class="chips-filtros" id="filtros-estado"></div>
          <div class="chips-filtros" id="filtros-tipo"></div>
          <div class="buscador">
            <span class="buscador-ico" aria-hidden="true">🔍</span>
            <input type="search" id="buscador-eventos" placeholder="Buscar evento..." autocomplete="off"
              aria-label="Buscar evento">
          </div>
        </div>

        <!-- Grid de eventos -->
        <div id="eventos-grid" class="grid-eventos"></div>
      </div>
    </section>
  </main>

  <noscript>
    <div style="padding: 1rem; text-align: center; background: #FBE6E6; color: #D64545; border-radius: 8px; margin: 1rem;">
      Esta página necesita JavaScript para cargar los datos. Activalo para ver los contenidos.
    </div>
  </noscript>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/lugares.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/eventos.js"></script>
</body>
</html>
